name: Feature Request 🫂
description: Suggest an idea or improvement for MK-link.
assignees: nameIess
labels: ["Feature Request"]
body:
  - type: markdown
    attributes:
      value: |
        ### Share your idea! 💡
        Help us understand how to make MK-link better for everyone.

  - type: textarea
    id: problem_use_case
    attributes:
      label: 🧩 Problem / Use Case
      description: "What problem are you facing, or what gap are you trying to fill?"
      placeholder: "e.g., I need to download icons in a specific folder structure..."
    validations:
      required: true

  - type: textarea
    id: expected_output
    attributes:
      label: 📤 Proposed Feature / Behavior
      description: "What should happen once this feature is implemented?"
      placeholder: |
        Example:-
        Supported formats: PNG / ICO / SVG 🎨
        Icon sizes: 64–512px or custom 📐
        Folder structure or naming rules 📁
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives / Workarounds
      description: "Have you tried another way to achieve this? Why wasn’t it good enough?"
      placeholder: |
        e.g.,
        - Used manual download, but it’s slow
        - Tried a different script, but it lacks format options
        - Used another tool, but it doesn’t support batch mode
    validations:
      required: false
