name: Windows CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Format check
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Error "gofmt required"
            $files | Write-Error
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Link integration tests
        run: go test -race -tags=integration ./internal/link

      - name: Security scan
        shell: pwsh
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
