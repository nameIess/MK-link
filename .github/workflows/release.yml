name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Windows executable
        shell: pwsh
        run: wails build -clean

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/mk-link.exe")) {
            throw "mk-link.exe was not produced"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: MK-Link ${{ github.ref_name }}
          body_path: .github/releases.md
          files: build/bin/mk-link.exe
          fail_on_unmatched_files: true
