name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a release already publishing the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        shell: pwsh
        working-directory: frontend
        run: npm run build

      - name: Go dependencies
        shell: pwsh
        run: go mod download

      - name: Go tests
        shell: pwsh
        run: go test ./...

      - name: Go vet
        shell: pwsh
        run: go vet ./...

      - name: Build Windows executable
        shell: pwsh
        run: wails build -clean

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/mk-link.exe")) {
            throw "mk-link.exe was not produced"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: MK-Link ${{ github.ref_name }}
          body_path: .github/releases.md
          files: build/bin/mk-link.exe
          fail_on_unmatched_files: true
