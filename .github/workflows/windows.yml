name: Windows build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w -H=windowsgui" -o mklink.exe .
      - name: Package icon
        shell: pwsh
        run: |
          if (-not (Test-Path ui/icon.ico)) { throw "ui/icon.ico is missing" }
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path mklink.exe)) { throw "mklink.exe was not produced" }
          if ((Get-Item mklink.exe).Length -lt 100KB) { throw "Executable is unexpectedly small" }
