<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>
        <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Rounded Windows 11 Squircle Shield -->
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
    <rect x="5" y="5" width="54" height="54" rx="12" fill="none" stroke="#06b6d4" stroke-opacity="0.18" stroke-width="1" />
    <!-- Vector Symbol -->
    <g filter="url(#glow)">
        <!-- Left Chain Link Ring -->
        <path d="M25 18H18a10 10 0 0 0-10 10v8a10 10 0 0 0 10 10h7" fill="none" stroke="url(#linkGrad)" stroke-width="5.5" stroke-linecap="round" />
        <!-- Right Chain Link Ring -->
        <path d="M39 46h7a10 10 0 0 0 10-10v-8a10 10 0 0 0-10-10h-7" fill="none" stroke="url(#linkGrad)" stroke-width="5.5" stroke-linecap="round" />
        <!-- Center Symlink Bridge & Arrow -->
        <path d="M20 32h22" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
        <path d="M36 25l8 7-8 7" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Subtle MK Corner Nodes -->
        <circle cx="18" cy="32" r="2.5" fill="#f8fafc" />
    </g>
</svg>